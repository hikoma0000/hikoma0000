name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 1 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=20&theme=vue-dark&locale=en
          path: profile/top-langs.svg
          token: ${{ vars.SHOW_PRIVATE == 'true' && secrets.GRS_TOKEN || github.token }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push

      - name: Keep schedule alive
        if: github.event.schedule == '0 12 1 * *'
        run: |
          git commit --allow-empty -m "Keep workflow alive"
          git push
